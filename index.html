<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tu Bazar de Confianza | Boutique de ropa de segunda mano</title>

    <meta 
        name="description" 
        content="Ropa de segunda mano seleccionada con cariño. Tops, blusas, vestidos y más, directo a tu WhatsApp."
    >

    <!-- Icono de pestaña -->
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- ==============================
         BOTÓN VISITAR
    =============================== -->

    <a href="ropa.html" class="btn-visitar">
        Visitar
        <i class="bi bi-arrow-right"></i>
    </a>


    <!-- ==============================
         HERO / PORTADA
    =============================== -->

    <main class="hero">

        <!-- Capa rosa sobre la imagen -->
        <div class="hero__overlay"></div>


        <!-- Contenido principal -->

        <div class="hero__content">

            <p class="hero__eyebrow">
                Prendas con historia, precios de bazar
            </p>


            <h1 class="hero__title">
                Tu Bazar
                <br>
                de Confianza
            </h1>


            <p class="hero__subtitle">
                Segunda mano, primera impresión
            </p>


            <!-- ==============================
                 REDES SOCIALES
            =============================== -->

            <nav 
                class="social"
                aria-label="Redes sociales"
            >

                <!-- Instagram -->

                <a 
                    href="https://www.instagram.com/tubazardeconfianza5?utm_source=ig_web_button_share_sheet&amp;igsi=ZDNlZDc0MzIxNw=="
                    class="social__link"
                    target="_blank"
                    rel="noopener"
                    aria-label="Instagram"
                >
                    <i class="bi bi-instagram"></i>
                </a>


                <!-- WhatsApp -->

                <a
                    href="https://chat.whatsapp.com/L27TM6CVe0R6IFYzoIs9O5"
                    class="social__link"
                    target="_blank"
                    rel="noopener"
                    aria-label="WhatsApp"
                >
                    <i class="bi bi-whatsapp"></i>
                </a>

            </nav>

        </div>


        <!-- Indicador para bajar -->

        <button
            class="scroll-hint"
            id="scrollHint"
            aria-label="Bajar"
        >

            <i class="bi bi-chevron-down"></i>

        </button>

    </main>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript propio -->

    <script src="js/script.js"></script>

</body>

</html>
