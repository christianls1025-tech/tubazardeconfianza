<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">

    <defs>
        <linearGradient id="cieloBoutique" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f7d8e6"/>
            <stop offset="55%" stop-color="#e9a6c4"/>
            <stop offset="100%" stop-color="#b5486f"/>
        </linearGradient>

        <linearGradient id="pisoBoutique" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7a2d4d"/>
            <stop offset="100%" stop-color="#4a1730"/>
        </linearGradient>
    </defs>

    <!-- Fondo -->
    <rect width="1600" height="900" fill="url(#cieloBoutique)"/>

    <!-- Vitrina / pared de fondo -->
    <rect x="0" y="0" width="1600" height="620" fill="#f3c2d8" opacity="0.35"/>

    <!-- Ventanales de boutique -->
    <g opacity="0.25" stroke="#5c1c3c" stroke-width="6">
        <rect x="120" y="90" width="260" height="420" rx="14" fill="#ffffff" fill-opacity="0.12"/>
        <rect x="1220" y="90" width="260" height="420" rx="14" fill="#ffffff" fill-opacity="0.12"/>
        <line x1="250" y1="90" x2="250" y2="510"/>
        <line x1="1350" y1="90" x2="1350" y2="510"/>
    </g>

    <!-- Piso -->
    <rect x="0" y="620" width="1600" height="280" fill="url(#pisoBoutique)"/>

    <!-- Riel del perchero -->
    <rect x="140" y="330" width="1320" height="14" rx="7" fill="#3a1226"/>
    <circle cx="150" cy="337" r="16" fill="#3a1226"/>
    <circle cx="1450" cy="337" r="16" fill="#3a1226"/>

    <!-- Patas del perchero -->
    <g fill="none" stroke="#3a1226" stroke-width="12" stroke-linecap="round">
        <line x1="200" y1="344" x2="200" y2="800"/>
        <line x1="1400" y1="344" x2="1400" y2="800"/>
        <line x1="140" y1="800" x2="260" y2="800"/>
        <line x1="1340" y1="800" x2="1460" y2="800"/>
    </g>

    <!-- ===================== PRENDAS COLGADAS ===================== -->

    <!-- Vestido rosa -->
    <g transform="translate(320,344)">
        <path d="M0 0 L60 0 L44 24 L60 40 L48 220 L12 220 L0 40 L16 24 Z" fill="#e8659c"/>
        <path d="M30 0 c-16 6 -16 26 0 30 c16 -4 16 -24 0 -30 Z" fill="#5c1c3c"/>
        <line x1="30" y1="-26" x2="30" y2="0" stroke="#3a1226" stroke-width="4"/>
        <path d="M22 -30 q8 -12 16 0" fill="none" stroke="#3a1226" stroke-width="4"/>
    </g>

    <!-- Blusa crema -->
    <g transform="translate(520,344)">
        <path d="M0 10 L20 -10 L60 -10 L80 10 L70 30 L58 20 L58 170 L22 170 L22 20 L10 30 Z" fill="#f7ece2"/>
        <line x1="40" y1="-36" x2="40" y2="-10" stroke="#3a1226" stroke-width="4"/>
        <path d="M32 -40 q8 -12 16 0" fill="none" stroke="#3a1226" stroke-width="4"/>
    </g>

    <!-- Vestido mostaza -->
    <g transform="translate(700,344)">
        <path d="M0 0 L64 0 L48 26 L64 44 L54 230 L10 230 L0 44 L16 26 Z" fill="#e0a63e"/>
        <line x1="32" y1="-26" x2="32" y2="0" stroke="#3a1226" stroke-width="4"/>
        <path d="M24 -30 q8 -12 16 0" fill="none" stroke="#3a1226" stroke-width="4"/>
    </g>

    <!-- Top verde salvia -->
    <g transform="translate(900,344)">
        <path d="M4 6 L26 -8 L48 -8 L70 6 L58 40 L48 26 L48 140 L26 140 L26 26 L16 40 Z" fill="#9db98f"/>
        <line x1="37" y1="-34" x2="37" y2="-8" stroke="#3a1226" stroke-width="4"/>
        <path d="M29 -38 q8 -12 16 0" fill="none" stroke="#3a1226" stroke-width="4"/>
    </g>

    <!-- Vestido rosa oscuro -->
    <g transform="translate(1060,344)">
        <path d="M0 0 L60 0 L44 24 L60 42 L46 224 L10 224 L0 42 L16 24 Z" fill="#b5486f"/>
        <line x1="30" y1="-26" x2="30" y2="0" stroke="#3a1226" stroke-width="4"/>
        <path d="M22 -30 q8 -12 16 0" fill="none" stroke="#3a1226" stroke-width="4"/>
    </g>

    <!-- Falda crema -->
    <g transform="translate(1220,344)">
        <path d="M6 0 L58 0 L74 130 L-10 130 Z" fill="#f7ece2"/>
        <rect x="6" y="-14" width="52" height="16" rx="6" fill="#e8659c"/>
    </g>

    <!-- ===================== ETIQUETAS / DETALLES ===================== -->

    <g fill="#ffffff" opacity="0.85">
        <circle cx="352" cy="420" r="5"/>
        <circle cx="1094" cy="440" r="5"/>
        <circle cx="734" cy="410" r="5"/>
    </g>

    <!-- Bolsa de bazar decorativa -->
    <g transform="translate(1120,660)" opacity="0.9">
        <path d="M0 40 L100 40 L92 200 L8 200 Z" fill="#fbeaf1"/>
        <path d="M20 40 v-16 a30 30 0 0 1 60 0 v16" fill="none" stroke="#5c1c3c" stroke-width="6"/>
        <text x="50" y="130" font-family="Georgia, serif" font-size="26" fill="#b5486f" text-anchor="middle">TB</text>
    </g>

    <!-- Suave viñeta inferior para dar profundidad -->
    <rect x="0" y="700" width="1600" height="200" fill="#2c0f1f" opacity="0.35"/>

</svg>
